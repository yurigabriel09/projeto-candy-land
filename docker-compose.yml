
services:
  backend:
    build:
      context: ./backend
    container_name: candyland-backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/instance/candyland.db
      PYTHONUNBUFFERED: "1"
    volumes:
      # Banco de dados persistente.
      - candyland-db:/app/instance

      # Imagens de produtos e fotos de perfil persistentes.
      - candyland-uploads:/app/uploads

      # Credencial FCM externa à imagem e somente leitura.
      - ./backend/secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/restaurantes', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Vazio faz o frontend chamar a API pela própria origem,
        # utilizando o proxy reverso do Nginx.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: candyland-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  candyland-db:
  candyland-uploads:
