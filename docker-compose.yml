services:
  backend:
    build:
      context: ./backend
    container_name: candyland-backend
    ports:
      - "5000:5000"
  
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/instance/candyland.db
    volumes:
      - candyland-db:/app/instance
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/restaurantes', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:5000}
    container_name: candyland-frontend
    ports:
      # Mantém a porta 5173 usada no projeto (origem já autorizada no Google/Facebook).
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  candyland-db: