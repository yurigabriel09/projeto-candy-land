services:
  backend:
    build:
      context: ./backend
    container_name: candyland-backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/instance/candyland.db
    volumes:
      - candyland-db:/app/instance
      # Credencial FCM fica fora da imagem e somente leitura. Crie backend/secrets antes de ativar.
      - ./backend/secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/restaurantes', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Vazio faz o bundle chamar /auth, /users etc. na própria origem.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: candyland-frontend
    ports:
      # ngrok deve apontar para a porta 5173 no host.
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  candyland-db:
