server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}